<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Journal AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0a0a0f; color: #f5f5f7; min-height: 100vh; }
  .hero { display: flex; flex-direction: column; align-items: center;
          justify-content: center; text-align: center;
          padding: 80px 24px 60px; }
  .icon { width: 120px; height: 120px; border-radius: 26px;
          background: linear-gradient(135deg, #1a2a4a, #2a4a7a);
          display: flex; align-items: center; justify-content: center;
          font-size: 56px; margin-bottom: 32px;
          box-shadow: 0 24px 48px rgba(0,0,0,0.5); }
  h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.02em;
       background: linear-gradient(135deg, #fff 60%, #a0b4d0);
       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .tagline { font-size: 1.2rem; color: #86868b; margin-top: 12px; max-width: 460px; line-height: 1.5; }
  .badges { display: flex; gap: 16px; margin-top: 40px; flex-wrap: wrap; justify-content: center; }
  .badge { background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 12px;
           padding: 12px 20px; font-size: 0.9rem; color: #86868b; }
  .badge strong { color: #f5f5f7; display: block; margin-bottom: 2px; }
  footer { text-align: center; padding: 40px 24px;
           color: #48484a; font-size: 0.85rem; border-top: 1px solid #1c1c1e; }
  footer a { color: #48484a; text-decoration: none; }
  footer a:hover { color: #86868b; }
</style>
</head>
<body>

<div class="hero">
  <div class="icon">✈️</div>
  <h1>Travel Journal AI</h1>
  <p class="tagline">Import a photo album and let Apple Intelligence write your travel journal — entirely on your device.</p>

  <div class="badges">
    <div class="badge">
      <strong>On-device AI</strong>
      Apple Intelligence only
    </div>
    <div class="badge">
      <strong>No account needed</strong>
      No cloud, no tracking
    </div>
    <div class="badge">
      <strong>Free</strong>
      No subscription
    </div>
  </div>
</div>

<footer>
  © 2026 Gary Crook &nbsp;·&nbsp;
  <a href="privacy/">Privacy Policy</a> &nbsp;·&nbsp;
  <a href="support/">Support</a>
</footer>

</body>
</html>
